name: r-microbiome
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - r-base=4.5
  - r-tidyverse
  - r-patchwork
  - r-argparse
  - r-plotly
  - r-vegan
  - r-git2r
  - r-kableextra
  - r-flextable
  - r-ggpubr
  - r-biocmanager
  - bioconductor-scater
  - bioconductor-ggtree
  - r-devtools ## Needed to fetch qiime2R and others from GitHub
  - r-ggridges
  - r-igraph # Dependency for some packages
  - r-rmpfr # For ancombc2
  - r-energy # For ancombc2 - lower version to avoid conflicts 
  - bioconductor-shortread # For dada2
  # - r-ggsignif
  # - r-ggstatsplot
  # - r-rstantools
  - bioconductor-biomformat
  # - bioconductor-ancombc>=2.8.0 # Install dev version
  - bioconductor-mia
  - bioconductor-aldex2
  - bioconductor-complexheatmap
  ## For NetCoMi clustering ?
  - bioconductor-limma
  - r-lme4
  ## Utils
  - r-languageserver
  - r-httpgd
  - r-janitor
  - r-openxlsx
  - r-ranger
  - r-xgboost
  - r-proc
  ## Additional data structures / import
  - r-rbiom=2.2.1 # mia 1.18 imports rbiom::unifrac, removed in rbiom 3
  - bioconductor-treesummarizedexperiment
  - bioconductor-biostrings
  - bioconductor-dada2
  - r-ape
  - r-remotes # To install mia from GitHub on top of the env
  ## Additional analysis
  - r-lmertest
  - r-glmmtmb
  - r-emmeans
  - r-car
  - r-rstatix
  - bioconductor-maaslin3
  - r-mikropml
  ## Additional plotting and tables
  - r-cowplot
  - r-ggrepel
  - r-ggtext
  - r-ggforce
  - r-rcolorbrewer
  - r-viridis
  - r-pheatmap
  - r-circlize
  - r-gt
  - r-gtsummary
  - r-hmisc
  - r-knitr
